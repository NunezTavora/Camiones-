<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3a5f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Camiones del turno</title>
<style>
/* Layout: dos pestañas (Descarga / Carga), tabla ancha con scroll lateral y primera columna fija */
:root{
  --bg:#f2f5f8; --surface:#ffffff; --fg:#16212c; --muted:#5b6a79; --line:#d3dbe3;
  --accent:#1f5fbf; --accent-fg:#ffffff; --head:#e4eaf0;
  --c-warn:#fff0a8; --c-bad:#ffc7c1; --c-ok:#c4ebcf; --c-info:#cde2fa;
  --danger:#b3261e;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f161d; --surface:#17212b; --fg:#e6edf3; --muted:#93a3b3; --line:#2b3947;
    --accent:#6aa5f5; --accent-fg:#08111b; --head:#1f2c39;
    --c-warn:#5c4d0c; --c-bad:#6b2420; --c-ok:#1f5230; --c-info:#1d4470;
    --danger:#ff8b82; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f161d; --surface:#17212b; --fg:#e6edf3; --muted:#93a3b3; --line:#2b3947;
  --accent:#6aa5f5; --accent-fg:#08111b; --head:#1f2c39;
  --c-warn:#5c4d0c; --c-bad:#6b2420; --c-ok:#1f5230; --c-info:#1d4470;
  --danger:#ff8b82; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));
  padding-block:12px;display:flex;flex-direction:column;gap:12px}
header{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
h1{font-size:1.25rem;margin:0;letter-spacing:.01em}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.meta label{color:var(--muted);font-size:.85rem}
input,select,button,textarea{font:inherit;color:inherit}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 12px;cursor:pointer;min-height:40px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
.btn.danger{color:var(--danger)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tab{background:transparent;border:0;border-bottom:3px solid transparent;padding:10px 16px;cursor:pointer;font-weight:600;color:var(--muted);min-height:44px}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.tab small{font-weight:400;margin-left:4px;font-variant-numeric:tabular-nums}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#import-msg{color:var(--muted);font-size:.85rem;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.chip{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:.85rem;background:var(--surface);font-variant-numeric:tabular-nums}
.chip.warn{background:var(--c-warn)} .chip.bad{background:var(--c-bad)} .chip.ok{background:var(--c-ok)} .chip.info{background:var(--c-info)}
.wrap{overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface);flex:1;min-height:0}
table{border-collapse:separate;border-spacing:0;width:100%}
#tbl-d{min-width:1120px} #tbl-c{min-width:1420px}
th{position:sticky;top:0;z-index:2;background:var(--head);text-align:left;font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;
  color:var(--muted);padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:0;border-bottom:1px solid var(--line);vertical-align:middle}
th:first-child,td:first-child{position:sticky;left:0;border-right:1px solid var(--line)}
th:first-child{z-index:3}
td:first-child{z-index:1;background:var(--surface)}
td input,td select{width:100%;border:0;background:transparent;padding:10px 6px;min-width:0}
td input:focus,td select:focus{background:color-mix(in srgb,var(--surface) 70%,transparent)}
input[aria-invalid="true"]{outline:2px solid var(--danger);outline-offset:-2px}
td.ro{padding:10px 8px;white-space:nowrap;color:var(--muted)}
td.ro.strong{color:var(--fg);font-weight:600}
tr.truck.s-aculado td{background:var(--c-warn)}
tr.truck.s-esperando td{background:var(--c-bad)}
tr.truck.s-finalizado td{background:var(--c-ok)}
tr.carga td{background:var(--c-info)}
tr.carga.c-proceso td{background:var(--c-warn)}
tr.carga.c-espera td{background:var(--c-bad)}
tr.carga.c-listo td{background:var(--c-ok)}
.x{width:44px}
.x button{border:0;background:transparent;color:var(--muted);cursor:pointer;min-width:44px;min-height:40px;font-size:.9rem}
.x button.armed{color:var(--danger);font-weight:600;white-space:nowrap}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);width:min(640px,calc(100vw - 24px));padding:16px}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h2{margin:0 0 6px;font-size:1.05rem}
dialog p{margin:0 0 10px;color:var(--muted);font-size:.9rem}
textarea{width:100%;min-height:160px;border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:8px;font-family:ui-monospace,Consolas,monospace;font-size:.85rem}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:10px;flex-wrap:wrap}
@media (prefers-reduced-motion:no-preference){ tr td{transition:background-color .15s} }
</style>
</head>
<body>
<header>
  <h1>Camiones del turno</h1>
  <div class="meta">
    <label for="fecha">Fecha del turno</label>
    <input id="fecha" class="btn" type="date">
    <button class="btn danger" id="reset">Limpiar</button>
  </div>
</header>

<div class="tabs" role="tablist">
  <button class="tab" role="tab" id="tab-d" data-tab="d">Descarga<small id="n-d"></small></button>
  <button class="tab" role="tab" id="tab-c" data-tab="c">Carga<small id="n-c"></small></button>
</div>

<div class="bar">
  <button class="btn primary" id="add"></button>
  <button class="btn" id="import">Importar Excel</button>
  <input type="file" id="file" accept=".xlsx,.csv,.txt" hidden>
  <span id="import-msg" role="status"></span>
  <div class="chips" id="chips"></div>
</div>

<div class="wrap" id="wrap-d" role="tabpanel">
  <table id="tbl-d">
    <thead>
      <tr>
        <th>VRID descarga</th><th>VRID carga</th><th>Tractora</th><th>Remolque</th><th>Estación</th><th>Estado</th>
        <th>Muelle</th><th>Hora planificada</th><th>Hora actual</th><th>Volumen</th><th></th>
      </tr>
    </thead>
    <tbody id="body-d"></tbody>
  </table>
</div>

<div class="wrap" id="wrap-c" role="tabpanel" hidden>
  <table id="tbl-c">
    <thead>
      <tr>
        <th>VRID carga</th><th>VRID descarga</th><th>Estación</th><th>Tractora</th><th>Remolque</th>
        <th>Hora de llegada</th><th>Hora de salida</th><th>Muelle</th><th>Tipo de carga</th><th>Muelle gabarra</th>
        <th>Nº carros</th><th>Nº palets</th><th>Estado</th><th></th>
      </tr>
    </thead>
    <tbody id="body-c"></tbody>
  </table>
</div>

<dialog id="dlg">
  <h2 id="dlg-title"></h2>
  <p id="dlg-help"></p>
  <textarea id="vrids" spellcheck="false" aria-label="VRID"></textarea>
  <p id="dlg-msg" role="status"></p>
  <div class="row">
    <button class="btn" id="dlg-cancel">Cancelar</button>
    <button class="btn primary" id="dlg-ok">Añadir</button>
  </div>
</dialog>

<script>
(function(){
  var KEY = 'camiones-turno-v1';
  var COLS = [
    ['vrid','VRID descarga'],['vridCarga','VRID carga'],['tractora','Tractora'],['remolque','Remolque'],['estacion','Estación'],
    ['estado','Estado'],['muelle','Muelle'],['plan','Hora planificada'],['actual','Hora actual'],['volumen','Volumen']
  ];
  var COLS_C = [
    ['vridCarga','VRID carga'],['estacion','Estación'],['tractora','Tractora'],['remolque','Remolque'],['muelle','Muelle']
  ];
  var LABEL = {};
  COLS.concat(COLS_C).forEach(function(c){ LABEL[c[0]] = c[1]; });
  var ESTADOS = ['En camino','Aculado','Esperando','Finalizado'];
  var SLUG = {'En camino':'camino','Aculado':'aculado','Esperando':'esperando','Finalizado':'finalizado'};
  var TIPOS = ['Carga directa','Cambio de gabarra'];
  var CESTADOS = ['En proceso','En espera','Listo'];
  var CSLUG = {'En proceso':'proceso','En espera':'espera','Listo':'listo'};

  var state = load() || {fecha:'', trucks:[]};
  state.trucks = state.trucks || [];
  state.cargas = state.cargas || [];
  state.tab = state.tab === 'c' ? 'c' : 'd';
  if(!/^\d{4}-\d{2}-\d{2}$/.test(state.fecha || '')) state.fecha = '';
  state.trucks.forEach(function(t){ t.carga = t.carga || {}; if(t.carga.salida === undefined) t.carga.salida = ''; if(t.carga.llegada === undefined) t.carga.llegada = ''; });
  state.cargas.forEach(function(c){ c.carga = c.carga || {}; if(c.carga.salida === undefined) c.carga.salida = c.actual || ''; if(c.carga.llegada === undefined) c.carga.llegada = ''; });
  var $ = function(id){return document.getElementById(id)};

  function load(){
    try{ var s = localStorage.getItem(KEY); return s ? JSON.parse(s) : null; }catch(e){ return null; }
  }
  function save(){
    try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
  }
  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function emptyCarga(){ return {tipo:'', muelle:'', carros:'', palets:'', estado:'', salida:'', llegada:''}; }
  function newTruck(v){
    v = v || {};
    var t = {id:uid(), estado:'En camino', carga:emptyCarga()};
    COLS.forEach(function(c){ if(c[0] !== 'estado') t[c[0]] = v[c[0]] || ''; });
    t.estado = mapEstado(v.estado);
    return t;
  }
  function newCarga(v){
    v = v || {};
    var c = {id:uid(), carga:emptyCarga()};
    COLS_C.forEach(function(x){ c[x[0]] = v[x[0]] || ''; });
    return c;
  }
  function opts(list, cur, blank){
    var h = blank ? '<option value=""'+(cur===''?' selected':'')+'>'+esc(blank)+'</option>' : '';
    list.forEach(function(o){ h += '<option'+(o===cur?' selected':'')+'>'+esc(o)+'</option>'; });
    return h;
  }
  var TIME_F = {plan:1, actual:1};
  var TIME_RE = /^([01]\d|2[0-3]):[0-5]\d$/;
  function timeAttrs(v){
    return ' data-time="1" inputmode="numeric" maxlength="5" placeholder="HH:MM"'
      + (v && !TIME_RE.test(v) ? ' aria-invalid="true"' : '');
  }
  function fmtLive(v){
    var d = String(v).replace(/\D/g,'').slice(0,4);
    return d.length > 2 ? d.slice(0,2) + ':' + d.slice(2) : d;
  }
  function normTime(v){
    var d = String(v).replace(/\D/g,'');
    if(!d) return '';
    var h, m;
    if(d.length <= 2){ h = d; m = '00'; }
    else if(d.length === 3){ h = d.slice(0,1); m = d.slice(1); }
    else { h = d.slice(0,2); m = d.slice(2,4); }
    return ('0'+h).slice(-2) + ':' + m;
  }
  function inp(f, v){
    return '<td><input data-f="'+f+'" value="'+esc(v)+'" aria-label="'+LABEL[f]+'" autocomplete="off"'
      + (TIME_F[f] ? timeAttrs(v) : '') + '></td>';
  }
  function timeC(f, v, label){
    return '<td><input data-c="'+f+'" value="'+esc(v)+'" aria-label="'+label+'" autocomplete="off"'+timeAttrs(v)+'></td>';
  }
  function ro(v, strong){
    return '<td class="ro'+(strong?' strong':'')+'">'+esc(v)+'</td>';
  }

  /* ---------- Descarga ---------- */
  function rowD(t){
    var h = '<tr class="truck s-'+SLUG[t.estado]+'" data-id="'+t.id+'" data-kind="t">';
    COLS.forEach(function(c){
      h += c[0] === 'estado'
        ? '<td><select data-f="estado" aria-label="Estado">'+opts(ESTADOS,t.estado)+'</select></td>'
        : inp(c[0], t[c[0]]);
    });
    h += '<td class="x"><button data-del title="Eliminar camión" aria-label="Eliminar camión">✕</button></td></tr>';
    return h;
  }

  /* ---------- Carga ---------- */
  function cargaList(){
    var out = [];
    state.trucks.forEach(function(t){ if(String(t.vridCarga).trim()) out.push({kind:'t', o:t}); });
    state.cargas.forEach(function(c){ out.push({kind:'c', o:c}); });
    return out;
  }
  function rowC(item){
    var o = item.o, link = item.kind==='t', c = o.carga;
    var cs = c.estado ? CSLUG[c.estado] : 'none';
    var h = '<tr class="carga c-'+cs+'" data-id="'+o.id+'" data-kind="'+item.kind+'">';
    h += link ? ro(o.vridCarga, true) : inp('vridCarga', o.vridCarga);
    h += link ? ro(o.vrid || '—') : ro('Solo carga');
    ['estacion','tractora','remolque'].forEach(function(f){
      h += link ? ro(o[f]) : inp(f, o[f]);
    });
    h += link ? ro(o.actual) : timeC('llegada', c.llegada, 'Hora de llegada');
    h += timeC('salida', c.salida, 'Hora de salida');
    h += link ? ro(o.muelle) : inp('muelle', o.muelle);
    h += '<td><select data-c="tipo" aria-label="Tipo de carga">'+opts(TIPOS,c.tipo,'Elegir…')+'</select></td>';
    if(c.tipo==='Cambio de gabarra')
      h += '<td><input data-c="muelle" value="'+esc(c.muelle)+'" aria-label="Muelle gabarra" autocomplete="off"></td>';
    else if(c.tipo==='Carga directa')
      h += '<td class="ro" title="Mismo muelle que la descarga">'+esc(o.muelle)+'</td>';
    else
      h += '<td></td>';
    h += '<td><input data-c="carros" inputmode="numeric" value="'+esc(c.carros)+'" aria-label="Número de carros" autocomplete="off"></td>';
    h += '<td><input data-c="palets" inputmode="numeric" value="'+esc(c.palets)+'" aria-label="Número de palets" autocomplete="off"></td>';
    h += '<td><select data-c="estado" aria-label="Estado de la carga">'+opts(CESTADOS,c.estado,'Elegir…')+'</select></td>';
    h += '<td class="x"><button data-del title="'+(link?'Quitar la carga de este camión':'Eliminar carga')+'" aria-label="Eliminar">✕</button></td></tr>';
    return h;
  }

  /* ---------- Render ---------- */
  function render(){
    var d = $('body-d'), c = $('body-c');
    d.innerHTML = state.trucks.length
      ? state.trucks.map(rowD).join('')
      : '<tr><td colspan="11"><div class="empty">Todavía no hay camiones de descarga en este turno. Pulsa «+ Camión» para añadir el primero.</div></td></tr>';
    var list = cargaList();
    c.innerHTML = list.length
      ? list.map(rowC).join('')
      : '<tr><td colspan="14"><div class="empty">No hay cargas. Aparecen aquí los camiones de descarga con VRID de carga, y puedes añadir cargas de camiones exclusivos con «+ Carga».</div></td></tr>';
    $('fecha').value = state.fecha || '';
    applyTab();
    counts();
  }

  function applyTab(){
    var d = state.tab === 'd';
    $('wrap-d').hidden = !d; $('wrap-c').hidden = d;
    $('tab-d').setAttribute('aria-selected', d); $('tab-c').setAttribute('aria-selected', !d);
    $('add').textContent = d ? '+ Camión' : '+ Carga';
  }

  function counts(){
    var list = cargaList();
    $('n-d').textContent = '(' + state.trucks.length + ')';
    $('n-c').textContent = '(' + list.length + ')';
    var h = '';
    if(state.tab === 'd'){
      var n = {}; ESTADOS.forEach(function(e){ n[e]=0; });
      state.trucks.forEach(function(t){ n[t.estado]++; });
      h = '<span class="chip">Total '+state.trucks.length+'</span>'
        + '<span class="chip">En camino '+n['En camino']+'</span>'
        + '<span class="chip warn">Aculados '+n['Aculado']+'</span>'
        + '<span class="chip bad">Esperando '+n['Esperando']+'</span>'
        + '<span class="chip ok">Finalizados '+n['Finalizado']+'</span>';
    } else {
      var m = {proceso:0, espera:0, listo:0, none:0}, carros = 0, palets = 0;
      list.forEach(function(it){
        var c = it.o.carga;
        m[c.estado ? CSLUG[c.estado] : 'none']++;
        carros += parseInt(c.carros,10)||0;
        palets += parseInt(c.palets,10)||0;
      });
      h = '<span class="chip">Total '+list.length+'</span>'
        + '<span class="chip info">Sin estado '+m.none+'</span>'
        + '<span class="chip warn">En proceso '+m.proceso+'</span>'
        + '<span class="chip bad">En espera '+m.espera+'</span>'
        + '<span class="chip ok">Listas '+m.listo+'</span>'
        + '<span class="chip">'+carros+' carros · '+palets+' palets</span>';
    }
    $('chips').innerHTML = h;
  }

  function find(tr){
    var id = tr.getAttribute('data-id');
    var list = tr.getAttribute('data-kind') === 'c' ? state.cargas : state.trucks;
    for(var i=0;i<list.length;i++) if(list[i].id===id) return list[i];
  }

  ['body-d','body-c'].forEach(function(bid){
    var tbody = $(bid);
    tbody.addEventListener('input', function(e){
      var el = e.target, tr = el.closest('tr'); if(!tr || el.tagName!=='INPUT') return;
      var o = find(tr); if(!o) return;
      if(el.dataset.time){ var fv = fmtLive(el.value); if(fv !== el.value) el.value = fv; }
      if(el.dataset.f) o[el.dataset.f] = el.value;
      else if(el.dataset.c) o.carga[el.dataset.c] = el.value;
      else return;
      save(); counts();
    });
    tbody.addEventListener('change', function(e){
      var el = e.target, tr = el.closest('tr'); if(!tr) return;
      var o = find(tr); if(!o) return;
      if(el.dataset.time){
        el.value = normTime(el.value);
        if(el.dataset.f) o[el.dataset.f] = el.value; else o.carga[el.dataset.c] = el.value;
        if(el.value && !TIME_RE.test(el.value)) el.setAttribute('aria-invalid','true'); else el.removeAttribute('aria-invalid');
        save(); return;
      }
      if(el.dataset.f==='estado'){ o.estado = el.value; }
      else if(el.dataset.f==='vridCarga'){ o.vridCarga = el.value; }
      else if(el.dataset.f==='muelle'){ o.muelle = el.value; }
      else if(el.dataset.c==='tipo'){ o.carga.tipo = el.value; if(el.value!=='Cambio de gabarra') o.carga.muelle=''; }
      else if(el.dataset.c==='estado'){ o.carga.estado = el.value; }
      else return;
      save(); render();
    });
    tbody.addEventListener('click', function(e){
      var b = e.target.closest('[data-del]'); if(!b) return;
      var tr = b.closest('tr'), o = find(tr), kind = tr.getAttribute('data-kind');
      if(b.classList.contains('armed')){
        if(kind === 'c') state.cargas = state.cargas.filter(function(x){ return x!==o; });
        else if(bid === 'body-c'){ o.vridCarga = ''; o.carga = emptyCarga(); }
        else state.trucks = state.trucks.filter(function(x){ return x!==o; });
        save(); render();
      } else {
        var prev = b.textContent;
        b.classList.add('armed'); b.textContent = '¿Seguro?';
        setTimeout(function(){ if(b.isConnected){ b.classList.remove('armed'); b.textContent = prev; } }, 3000);
      }
    });
  });

  $('fecha').addEventListener('input', function(e){ state.fecha = e.target.value; save(); });

  [$('tab-d'), $('tab-c')].forEach(function(b){
    b.addEventListener('click', function(){ state.tab = b.dataset.tab; save(); render(); });
  });

  var dlg = $('dlg'), ta = $('vrids'), msg = $('dlg-msg');
  $('add').addEventListener('click', function(){
    var d = state.tab === 'd';
    $('dlg-title').textContent = d ? 'Nuevos camiones' : 'Nuevas cargas';
    $('dlg-help').textContent = 'Escribe o pega los VRID de ' + (d ? 'descarga' : 'carga')
      + ', uno por línea o separados por espacios o comas. Se crea una fila por cada uno. Si lo dejas vacío se añade una fila en blanco.'
      + (d ? ' También puedes pegar filas copiadas de Excel: VRID descarga, tres columnas libres (VRID carga, tractora, remolque), estación, estado, muelle, hora planificada, hora actual y volumen. Valen con o sin las tres columnas vacías.' : '');
    ta.value = ''; msg.textContent = ''; $('dlg-cancel').textContent = 'Cancelar';
    dlg.showModal(); ta.focus();
  });
  $('dlg-cancel').addEventListener('click', function(){ dlg.close(); });
  $('dlg-ok').addEventListener('click', function(){
    var d = state.tab === 'd', field = d ? 'vrid' : 'vridCarga';
    var seen = {};
    (d ? state.trucks : cargaList().map(function(it){ return it.o; })).forEach(function(o){
      var k = String(o[field] || '').trim().toLowerCase(); if(k) seen[k] = 1;
    });
    var entries = [], added = 0, noId = 0, skipped = [];
    ta.value.split(/\r?\n/).forEach(function(line){
      if(!line.trim()) return;
      if(d && line.indexOf('\t') > -1){
        var f = line.split('\t').map(function(x){ return x.trim(); });
        if(f.length <= 7) f = [f[0], '', '', ''].concat(f.slice(1));
        var v = {};
        COLS.forEach(function(c, i){ var x = f[i] || ''; v[c[0]] = TIME_F[c[0]] ? toTime(x) : x; });
        entries.push(v);
      } else line.split(/[\s,;]+/).filter(Boolean).forEach(function(id){ var v = {}; v[field] = id; entries.push(v); });
    });
    if(!entries.length){
      if(d) state.trucks.push(newTruck()); else state.cargas.push(newCarga());
      added = 1;
    } else entries.forEach(function(v){
      var id = v[field] || '', k = id.toLowerCase();
      if(!id){ noId++; return; }
      if(seen[k]){ if(skipped.indexOf(id) < 0) skipped.push(id); return; }
      seen[k] = 1;
      if(d) state.trucks.push(newTruck(v)); else state.cargas.push(newCarga(v));
      added++;
    });
    save(); render();
    if(added){
      var rows = $(d ? 'body-d' : 'body-c').querySelectorAll('tr[data-id]');
      var last = rows[rows.length-1]; if(last) last.scrollIntoView({block:'nearest'});
    }
    if(skipped.length || noId){
      msg.textContent = (added ? 'Añadidos ' + added + '. ' : '')
        + (skipped.length ? 'Ya estaban en la tabla y no se repiten: ' + skipped.join(', ') + '. ' : '')
        + (noId ? noId + ' fila(s) sin VRID.' : '');
      ta.value = ''; $('dlg-cancel').textContent = 'Cerrar';
    } else dlg.close();
  });

  /* ---------- Importar Excel / CSV ---------- */
  var IMP_D = [
    ['vridCarga', /vrid.*\b(carga|outbound|load)\b|\b(carga|outbound|load)\b.*vrid/],
    ['vrid', /vrid.*(descarga|inbound|unload)|(descarga|inbound|unload).*vrid|^vrid$/],
    ['estacion', /estacion|station|origen|origin/],
    ['tractora', /tractora|tractor|cabeza/],
    ['remolque', /remolque|trailer/],
    ['estado', /estado|status/],
    ['volumen', /volumen|volume/],
    ['plan', /plan|programad|sched/],
    ['actual', /actual|llegada|arribo|arrival/],
    ['muelle', /muelle|dock|door|puerta/]
  ];
  var IMP_C = [
    ['vridCarga', /vrid.*\b(carga|outbound|load)\b|\b(carga|outbound|load)\b.*vrid|^vrid$/],
    ['estacion', /estacion|station/],
    ['tractora', /tractora|tractor|cabeza/],
    ['remolque', /remolque|trailer/],
    ['llegada', /llegada|arribo|arrival/],
    ['salida', /salida|depart/],
    ['muelle', /muelle|dock|door|puerta/]
  ];
  var TIME_KEYS = {plan:1, actual:1, llegada:1, salida:1};
  var infoTimer;
  function showInfo(t){
    var el = $('import-msg'); el.textContent = t;
    clearTimeout(infoTimer); infoTimer = setTimeout(function(){ el.textContent = ''; }, 15000);
  }
  function nrm(s){
    return String(s == null ? '' : s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
  }
  function toTime(v){
    if(typeof v === 'number'){
      var f = v - Math.floor(v);
      if(f === 0) return (v >= 100 && v < 2400) ? normTime(String(v)) : '';
      var m = Math.round(f * 1440) % 1440;
      return ('0'+Math.floor(m/60)).slice(-2) + ':' + ('0'+(m%60)).slice(-2);
    }
    v = String(v == null ? '' : v).trim();
    if(!v) return '';
    var mt = v.match(/(\d{1,2}):(\d{2})/);
    if(mt) return ('0'+mt[1]).slice(-2) + ':' + mt[2];
    var n = normTime(v);
    return TIME_RE.test(n) ? n : v;
  }
  function mapEstado(v){
    var t = nrm(v);
    if(!t) return 'En camino';
    if(/finaliz|complet|termin|cerrad|done/.test(t)) return 'Finalizado';
    if(/esper|wait/.test(t)) return 'Esperando';
    if(/acul|dock/.test(t)) return 'Aculado';
    return 'En camino';
  }
  function parseCsv(t){
    t = t.replace(/^﻿/, '');
    var first = t.split(/\r?\n/, 1)[0] || '';
    var delim = ['\t',';',','].reduce(function(a,b){ return first.split(b).length > first.split(a).length ? b : a; }, ',');
    var rows = [], row = [], cell = '', q = false;
    for(var i = 0; i < t.length; i++){
      var ch = t[i];
      if(q){
        if(ch === '"'){ if(t[i+1] === '"'){ cell += '"'; i++; } else q = false; }
        else cell += ch;
      } else if(ch === '"') q = true;
      else if(ch === delim){ row.push(cell); cell = ''; }
      else if(ch === '\n' || ch === '\r'){
        if(ch === '\r' && t[i+1] === '\n') i++;
        row.push(cell); cell = ''; rows.push(row); row = [];
      } else cell += ch;
    }
    if(cell !== '' || row.length){ row.push(cell); rows.push(row); }
    return rows;
  }

  /* lector mínimo de .xlsx: zip + XML, sin librerías */
  function unzipIndex(buf){
    var dv = new DataView(buf), u8 = new Uint8Array(buf), files = {}, e = -1;
    for(var i = buf.byteLength - 22; i >= Math.max(0, buf.byteLength - 66000); i--){
      if(dv.getUint32(i, true) === 0x06054b50){ e = i; break; }
    }
    if(e < 0) throw new Error('zip');
    var n = dv.getUint16(e + 10, true), p = dv.getUint32(e + 16, true), dec = new TextDecoder();
    for(var k = 0; k < n; k++){
      if(dv.getUint32(p, true) !== 0x02014b50) break;
      var nl = dv.getUint16(p+28, true), xl = dv.getUint16(p+30, true), cl = dv.getUint16(p+32, true);
      files[dec.decode(u8.subarray(p+46, p+46+nl))] = {method: dv.getUint16(p+10, true), csize: dv.getUint32(p+20, true), off: dv.getUint32(p+42, true)};
      p += 46 + nl + xl + cl;
    }
    return files;
  }
  async function zipText(buf, files, name){
    var ent = files[name]; if(!ent) return null;
    var dv = new DataView(buf);
    var start = ent.off + 30 + dv.getUint16(ent.off + 26, true) + dv.getUint16(ent.off + 28, true);
    var data = new Uint8Array(buf, start, ent.csize), out = data;
    if(ent.method === 8){
      var s = new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
      out = new Uint8Array(await new Response(s).arrayBuffer());
    }
    return new TextDecoder().decode(out);
  }
  function xml(t){ return new DOMParser().parseFromString(t, 'application/xml'); }
  function all(node, tag){ return Array.prototype.slice.call(node.getElementsByTagNameNS('*', tag)); }
  function colIdx(ref){
    var l = ref.replace(/[^A-Z]/gi, '').toUpperCase(), n = 0;
    for(var i = 0; i < l.length; i++) n = n * 26 + l.charCodeAt(i) - 64;
    return n - 1;
  }
  async function readXlsx(buf){
    var files = unzipIndex(buf), ss = [];
    var sst = await zipText(buf, files, 'xl/sharedStrings.xml');
    if(sst) all(xml(sst), 'si').forEach(function(si){
      ss.push(all(si, 't').filter(function(t){ return !t.parentNode || t.parentNode.localName !== 'rPh'; })
        .map(function(t){ return t.textContent; }).join(''));
    });
    var path = 'xl/worksheets/sheet1.xml';
    var wb = await zipText(buf, files, 'xl/workbook.xml'), rels = await zipText(buf, files, 'xl/_rels/workbook.xml.rels');
    if(wb && rels){
      var sh = all(xml(wb), 'sheet')[0];
      var rid = sh && sh.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id');
      all(xml(rels), 'Relationship').forEach(function(r){
        if(r.getAttribute('Id') === rid){
          var tg = r.getAttribute('Target');
          path = tg.charAt(0) === '/' ? tg.slice(1) : 'xl/' + tg;
        }
      });
    }
    var sheet = await zipText(buf, files, path);
    if(!sheet) throw new Error('sheet');
    var rows = [];
    all(xml(sheet), 'c').forEach(function(c){
      var ref = c.getAttribute('r'); if(!ref) return;
      var ri = parseInt(ref.replace(/\D/g, ''), 10) - 1, ci = colIdx(ref), t = c.getAttribute('t');
      var vEl = all(c, 'v')[0], v = vEl ? vEl.textContent : '', val;
      if(t === 's') val = ss[parseInt(v, 10)] || '';
      else if(t === 'inlineStr') val = all(c, 't').map(function(x){ return x.textContent; }).join('');
      else if(t === 'str' || t === 'b') val = v;
      else if(t === 'e' || v === '') val = '';
      else val = parseFloat(v);
      (rows[ri] = rows[ri] || [])[ci] = val;
    });
    for(var i = 0; i < rows.length; i++){
      rows[i] = rows[i] || [];
      for(var j = 0; j < rows[i].length; j++) if(rows[i][j] === undefined) rows[i][j] = '';
    }
    return rows;
  }

  function importRows(rows, fname){
    var d = state.tab === 'd', spec = d ? IMP_D : IMP_C, idKey = d ? 'vrid' : 'vridCarga';
    var best = -1, bestN = 0, map = null;
    for(var r = 0; r < Math.min(rows.length, 25); r++){
      var m = {}, cnt = 0;
      (rows[r] || []).forEach(function(h, ci){
        var t = nrm(h); if(!t) return;
        for(var k = 0; k < spec.length; k++){
          if(!(spec[k][0] in m) && spec[k][1].test(t)){ m[spec[k][0]] = ci; cnt++; break; }
        }
      });
      if(idKey in m && cnt > bestN){ best = r; bestN = cnt; map = m; }
    }
    if(!map){
      showInfo('No encuentro la columna «' + (d ? 'VRID descarga' : 'VRID carga') + '» en ' + fname + '. La primera fila debe tener los nombres de las columnas.');
      return;
    }
    var seen = {};
    (d ? state.trucks : cargaList().map(function(it){ return it.o; })).forEach(function(o){
      var k = String(o[idKey] || '').trim().toLowerCase(); if(k) seen[k] = 1;
    });
    var added = 0, dup = 0, noId = 0;
    for(var i = best + 1; i < rows.length; i++){
      var row = rows[i] || [], v = {}, any = false;
      Object.keys(map).forEach(function(key){
        var raw = row[map[key]]; if(raw === undefined) raw = '';
        v[key] = TIME_KEYS[key] ? toTime(raw) : String(raw).trim();
        if(v[key]) any = true;
      });
      if(!any) continue;
      var id = v[idKey];
      if(!id){ noId++; continue; }
      if(seen[id.toLowerCase()]){ dup++; continue; }
      seen[id.toLowerCase()] = 1;
      if(d) state.trucks.push(newTruck(v));
      else { var nc = newCarga(v); nc.carga.llegada = v.llegada || ''; nc.carga.salida = v.salida || ''; state.cargas.push(nc); }
      added++;
    }
    save(); render();
    showInfo('Importadas ' + added + (d ? ' filas de descarga' : ' filas de carga') + ' desde ' + fname + '.'
      + (dup ? ' ' + dup + ' ya estaban en la tabla.' : '') + (noId ? ' ' + noId + ' sin VRID.' : ''));
  }

  $('import').addEventListener('click', function(){ $('file').click(); });
  $('file').addEventListener('change', async function(e){
    var f = e.target.files[0]; e.target.value = ''; if(!f) return;
    try{
      var buf = await f.arrayBuffer(), sig = new Uint8Array(buf, 0, 4), rows;
      if(sig[0] === 0x50 && sig[1] === 0x4B) rows = await readXlsx(buf);
      else if(sig[0] === 0xD0 && sig[1] === 0xCF){ showInfo('Ese es un Excel antiguo (.xls). Guárdalo como .xlsx y vuelve a importarlo.'); return; }
      else rows = parseCsv(new TextDecoder().decode(buf));
      importRows(rows, f.name);
    }catch(err){
      showInfo('No he podido leer ' + f.name + '. Prueba a guardarlo de nuevo como .xlsx o .csv.');
    }
  });

  var rb = $('reset');
  rb.addEventListener('click', function(){
    if(rb.dataset.armed){
      state = {fecha:'', trucks:[], cargas:[], tab:state.tab}; save(); render();
      rb.textContent = 'Limpiar'; delete rb.dataset.armed;
    } else {
      rb.dataset.armed = '1'; rb.textContent = '¿Borrar todo?';
      setTimeout(function(){ if(rb.dataset.armed){ delete rb.dataset.armed; rb.textContent='Limpiar'; } }, 3500);
    }
  });

  render();

  if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }
})();
</script>
